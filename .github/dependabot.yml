version: 2
updates:
  # Go modules. Grouped into a single PR per run to keep the large dependency
  # tree (AWS SDK, GCP, franz-go, mongo driver, ...) from flooding the queue.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait for a release to age before opening a PR — dodges yanked/compromised
    # versions and cuts churn from rapid point releases.
    cooldown:
      default-days: 7
    # v1.7.0 rewrites the MCP wire protocol (2026-07-28) and removes
    # resources/subscribe; internal/mcp still targets the 2025-11-25 revision.
    # Revisit when adapting the server (see PR #57).
    ignore:
      - dependency-name: github.com/modelcontextprotocol/go-sdk
        versions: [">=1.7.0"]
      # v1.84.x reintroduces reachable GO-2026-6443. The fix is only in
      # v1.85.0-dev so far; v1.83.2 is the last stable release without it.
      # Use the 1.84.x matcher; a comma range is not applied by Dependabot.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.x"]
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Rust FFI crate.
  - package-ecosystem: cargo
    directory: "/rust/kaptanto-ffi"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot bumps the
  # pinned SHA and updates the trailing version comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
