name: Benchmark

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenarios (empty = all 6: steady,burst,large-batch,crash-recovery,idle,cluster)'
        required: false
        default: ''

# Least-privilege default token.
permissions:
  contents: read

jobs:
  benchmark:
    name: CDC Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          # Remove large pre-installed SDKs that are unused by this workflow.
          # Typically reclaims 20–25 GB on ubuntu-latest.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -q
          docker image prune -af --filter "until=1h" 2>/dev/null || true
          df -h /

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build bench binaries
        working-directory: bench
        run: |
          go build -o cmd/collector/collector ./cmd/collector
          go build -o cmd/loadgen/loadgen ./cmd/loadgen
          go build -o cmd/reporter/reporter ./cmd/reporter
          go build -o cmd/regress/regress ./cmd/regress

      - name: Clean slate
        working-directory: bench
        run: docker compose down -v --remove-orphans 2>/dev/null || true

      - name: Run benchmark scenarios
        working-directory: bench
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          ARGS="--collector-bin ./cmd/collector/collector \
                --loadgen-bin ./cmd/loadgen/loadgen \
                --output-dir ./results \
                --compose-dir . \
                --dsn postgres://bench:bench@localhost:5433/bench"
          if [ -n "$SCENARIOS" ]; then
            ARGS="$ARGS --scenarios $SCENARIOS"
          fi
          for attempt in 1 2 3; do
            if go run ./cmd/scenarios $ARGS; then
              exit 0
            fi
            echo "scenarios attempt $attempt failed; cleaning up and retrying..."
            docker compose down -v --remove-orphans 2>/dev/null || true
            sleep 30
          done
          echo "scenarios failed after 3 attempts" >&2
          exit 1

      - name: Generate report
        working-directory: bench
        run: |
          ./cmd/reporter/reporter \
            --metrics ./results/metrics.jsonl \
            --stats ./results/docker_stats.jsonl \
            --output-dir ./results \
            --hardware "GitHub Actions ubuntu-latest (4 vCPU, 16 GB RAM, x86_64)"

      - name: Regression check
        working-directory: bench
        run: ./cmd/regress/regress

      - name: Teardown
        if: always()
        working-directory: bench
        run: docker compose down -v --remove-orphans

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.run_id }}-${{ github.sha }}
          path: |
            bench/results/metrics.jsonl
            bench/results/docker_stats.jsonl
            bench/results/REPORT.md
            bench/results/report.html
            bench/results/baseline-metrics.json
          retention-days: 90

      - name: Upload baseline artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline-main
          path: bench/results/metrics.jsonl
          retention-days: 90
