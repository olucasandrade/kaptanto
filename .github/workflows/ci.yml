name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Least-privilege default token.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: go test
        run: CGO_ENABLED=0 go test ./... -v -count=1 -timeout 120s

  bench-test:
    name: Bench module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bench/go.mod
          cache: true

      # bench/ is a separate Go module (bench/go.mod), so the root `go test
      # ./...` above never descends into it. This runs the harness's own
      # regression tests (percentile math, metrics parser, collector
      # adapters, scenario registry) — no Docker required, ~10s.
      - name: go vet
        working-directory: bench
        run: CGO_ENABLED=0 go vet ./...

      - name: go test
        working-directory: bench
        run: CGO_ENABLED=0 go test ./... -count=1 -timeout 120s

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The race detector requires CGO. This is the one CI job that builds with
      # CGO_ENABLED=1; the static-distribution guarantee is enforced separately
      # by verify-no-cgo below.
      - name: go test -race
        run: CGO_ENABLED=1 go test ./... -race -count=1 -timeout 300s

  verify-no-cgo:
    name: Verify pure-Go cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...

      - name: darwin/arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

      - name: windows/amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
