name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly re-scan so newly published CodeQL queries catch existing code.
    - cron: "27 4 * * 1"

# Blocking: findings surface in the Security tab and the "CodeQL" code-scanning
# check fails on new error-level alerts. To enforce on merge, use a code-scanning
# ruleset ("Require code scanning results") rather than a required status check —
# the status check alone does not gate on CodeQL alerts. See security.yml.
jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read
      actions: read
    steps:
      # CodeQL's diff-informed analysis fetches the PR base branch during the
      # analyze step, which needs the checkout-persisted credentials — so we do
      # NOT set persist-credentials: false here (unlike every other workflow).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1 # zizmor: ignore[artipacked]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          # Go only. The Rust FFI crate is covered by cargo-audit (rust-audit.yml)
          # to avoid standing up the CGO + cbindgen build path in CI.
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        env:
          CGO_ENABLED: "0"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:go"
