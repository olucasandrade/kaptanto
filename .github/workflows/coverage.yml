name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Least-privilege default token.
permissions:
  contents: read

jobs:
  coverage:
    name: Test coverage threshold
    runs-on: ubuntu-latest
    # Aggregate threshold, exclusion list, and the per-package floor all
    # live in scripts/coverage-gate.sh — the same script `make cover` runs
    # locally, so local and CI always agree. Edit values there, not here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: |
          CGO_ENABLED=0 go test ./internal/... ./cmd/... \
            -count=1 -timeout 180s \
            -coverprofile=coverage.out -covermode=count

      - name: Generate HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Enforce coverage gate
        run: ./scripts/coverage-gate.sh coverage.out

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30
