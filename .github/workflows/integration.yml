name: Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default token.
permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (Postgres + MongoDB + RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      MONGO_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      # Second database in the same Postgres container. Kept separate from
      # POSTGRES_TEST_DSN so the cluster-membership and backfill Postgres-store
      # suites don't share state with the HA/publication tests running against
      # POSTGRES_TEST_DSN.
      TEST_CLUSTER_DSN: postgres://postgres:postgres@localhost:5432/cluster_test?sslmode=disable
      RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Both databases need non-default startup args (Postgres: logical
      # replication; Mongo: a replica set for Change Streams), which the GitHub
      # `services:` block cannot pass reliably. Run them as explicit containers.
      - name: Start Postgres (logical replication)
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:16 \
            -c wal_level=logical \
            -c max_replication_slots=10 \
            -c max_wal_senders=10
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres ready"; break
            fi
            echo "  waiting ($i)..."; sleep 2
          done
          # Second database for TEST_CLUSTER_DSN (cluster-membership +
          # backfill Postgres-store suites) — isolated from the "postgres"
          # database used by POSTGRES_TEST_DSN.
          docker exec postgres psql -U postgres -c 'CREATE DATABASE cluster_test;'

      - name: Start RabbitMQ
        run: |
          docker run -d --name rabbitmq \
            -p 5672:5672 \
            rabbitmq:3
          echo "Waiting for RabbitMQ..."
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              echo "RabbitMQ ready"; break
            fi
            echo "  waiting ($i)..."; sleep 2
          done

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          echo "Waiting for mongod..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            echo "  waiting ($i)..."; sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          echo "Waiting for PRIMARY..."
          primary_ready=false
          for i in $(seq 1 30); do
            state=$(docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then echo "PRIMARY ready"; primary_ready=true; break; fi
            echo "  state=$state ($i)..."; sleep 2
          done
          if [ "$primary_ready" != "true" ]; then
            echo "ERROR: MongoDB replica set never reached PRIMARY; aborting." >&2
            docker logs mongo 2>&1 | tail -50 || true
            exit 1
          fi

      - name: Run integration tests
        run: CGO_ENABLED=0 go test ./... -count=1 -timeout 300s

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== postgres ==="; docker logs postgres 2>&1 | tail -50 || true
          echo "=== mongo ==="; docker logs mongo 2>&1 | tail -50 || true
          echo "=== rabbitmq ==="; docker logs rabbitmq 2>&1 | tail -50 || true
