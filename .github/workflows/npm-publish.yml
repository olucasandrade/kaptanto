name: npm publish

on:
  push:
    tags:
      - "events-v*"
      - "n8n-v*"
      - "mastra-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - kaptanto-events
          - n8n-nodes-kaptanto
          - kaptanto-mastra

permissions:
  contents: read

jobs:
  publish-events:
    name: Publish @kaptanto/events
    if: startsWith(github.ref, 'refs/tags/events-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'kaptanto-events')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance OIDC provenance
    defaults:
      run:
        working-directory: packages/kaptanto-events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: "" # explicitly disabled; no cache is used in publish workflow

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-n8n:
    name: Publish n8n-nodes-kaptanto
    if: startsWith(github.ref, 'refs/tags/n8n-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'n8n-nodes-kaptanto')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance OIDC provenance
    defaults:
      run:
        working-directory: n8n-nodes-kaptanto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22" # n8n-workflow -> isolated-vm requires Node >= 22
          registry-url: https://registry.npmjs.org
          cache: "" # explicitly disabled; no cache is used in publish workflow

      # @kaptanto/events is a local linked dependency; build it before the n8n
      # package attempts to resolve it.
      - name: Build @kaptanto/events dependency
        working-directory: packages/kaptanto-events
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mastra:
    name: Publish @kaptanto/mastra
    if: startsWith(github.ref, 'refs/tags/mastra-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'kaptanto-mastra')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance OIDC provenance
    defaults:
      run:
        working-directory: packages/kaptanto-mastra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: "" # explicitly disabled; no cache is used in publish workflow

      # @kaptanto/events is a local linked peer dependency; build it first.
      - name: Build @kaptanto/events dependency
        working-directory: packages/kaptanto-events
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
