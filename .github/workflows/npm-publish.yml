name: npm publish

on:
  push:
    tags:
      - "events-v*"
      - "n8n-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - kaptanto-events
          - n8n-nodes-kaptanto

permissions:
  contents: read
  id-token: write # OIDC provenance

jobs:
  publish-events:
    name: Publish @kaptanto/events
    if: startsWith(github.ref, 'refs/tags/events-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'kaptanto-events')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kaptanto-events
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: packages/kaptanto-events/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-n8n:
    name: Publish n8n-nodes-kaptanto
    if: startsWith(github.ref, 'refs/tags/n8n-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'n8n-nodes-kaptanto')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-nodes-kaptanto
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: n8n-nodes-kaptanto/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
