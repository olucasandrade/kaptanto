name: PyPI publish

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  test:
    name: kaptanto (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test + langchain deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Run tests
        run: pytest -q

  publish:
    name: Publish kaptanto to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kaptanto
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no token secret
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build sdist + wheel (hatchling via uv)
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/kaptanto-python/dist
