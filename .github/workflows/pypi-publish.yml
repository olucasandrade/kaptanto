name: PyPI publish

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  test:
    name: kaptanto (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test + langchain deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Run tests
        run: pytest -q

  publish:
    name: Publish kaptanto to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kaptanto
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no token secret
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build sdist + wheel (hatchling via uv)
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: packages/kaptanto-python/dist
