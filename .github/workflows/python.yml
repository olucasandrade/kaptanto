name: Python

on:
  push:
    branches: ["main"]
    paths:
      - "packages/kaptanto-python/**"
      - "internal/event/testdata/changeevent_fixtures.ndjson"
      - "Makefile"
      - ".github/workflows/python.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "packages/kaptanto-python/**"
      - "packages/kaptanto-events/test/fixtures/**"
      - "internal/event/testdata/changeevent_fixtures.ndjson"
      - "Makefile"
      - ".github/workflows/python.yml"
      - ".github/workflows/pypi-publish.yml"

permissions:
  contents: read

jobs:
  fixtures:
    name: fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Copy fixtures and fail on drift
        run: make fixtures

  test:
    name: kaptanto (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test + langchain deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Run tests
        run: pytest -q

  # Acceptance: core install works without langchain present.
  test-core-only:
    name: kaptanto (core, no langchain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kaptanto-python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install core package only (no langchain extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert langchain-core is absent and core imports work
        run: |
          python -c "import importlib.util, sys; assert importlib.util.find_spec('langchain_core') is None, 'langchain_core must not be installed'"
          python -c "import kaptanto; from kaptanto import ChangeEvent, KaptantoStream; print(kaptanto.__version__)"
          pytest -q tests/test_models.py tests/test_client.py tests/test_core_no_langchain.py
