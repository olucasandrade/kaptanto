name: TypeScript

on:
  push:
    branches: ["main"]
    paths:
      - "packages/kaptanto-events/**"
      - "packages/kaptanto-mastra/**"
      - "packages/n8n-nodes-kaptanto/**"
      - "internal/event/testdata/changeevent_fixtures.ndjson"
      - "Makefile"
      - ".github/workflows/ts.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "packages/kaptanto-events/**"
      - "packages/kaptanto-mastra/**"
      - "packages/n8n-nodes-kaptanto/**"
      - "internal/event/testdata/changeevent_fixtures.ndjson"
      - "Makefile"
      - ".github/workflows/ts.yml"

permissions:
  contents: read

jobs:
  fixtures:
    name: fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy fixtures and fail on drift
        run: make fixtures

  test-events:
    name: "@kaptanto/events"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kaptanto-events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/kaptanto-events/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  test-mastra:
    name: "@kaptanto/mastra"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kaptanto-mastra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/kaptanto-mastra/package-lock.json

      # @kaptanto/events is a local linked peer dependency. Its dist/ is not
      # checked in, so we must build it before the mastra package can resolve it.
      - name: Build @kaptanto/events dependency
        working-directory: packages/kaptanto-events
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run build
      - run: npm test

  test-n8n:
    name: n8n-nodes-kaptanto
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-nodes-kaptanto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # n8n-workflow pulls in isolated-vm, whose prebuilt binaries require
      # Node >= 22.0.0. Running this job on Node 20 causes a native compile
      # against V8 headers that no longer expose v8::SourceLocation.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/n8n-nodes-kaptanto/package-lock.json

      # @kaptanto/events is a local linked dependency. Its dist/ is not checked
      # in, so we must build it before the n8n package can resolve the module.
      - name: Build @kaptanto/events dependency
        working-directory: packages/kaptanto-events
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run build
      - run: npm test
