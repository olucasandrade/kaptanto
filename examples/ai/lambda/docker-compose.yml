services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5443:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro

  kaptanto:
    build:
      context: ../../..
      dockerfile: examples/shared/Dockerfile.kaptanto
    command: ["--config", "/app/kaptanto.yaml"]
    environment:
      LAMBDA_FUNCTION_URL: ${LAMBDA_FUNCTION_URL:?set LAMBDA_FUNCTION_URL to your Function URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Standard AWS provider chain (SigV4). Prefer a dedicated IAM user/role.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    depends_on:
      - postgres
    ports:
      - "7663:7654"
    volumes:
      - ./kaptanto.yaml:/app/kaptanto.yaml:ro
      # Mount host AWS creds when not using env keys / IRSA:
      - ${HOME}/.aws:/aws:ro
