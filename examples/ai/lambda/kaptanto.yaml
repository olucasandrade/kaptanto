source: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
output: none
port: 7654
data-dir: /data
source-id: lambda_demo
insecure: true

tables:
  public.orders: {}

actions:
  - name: order-lambda
    type: lambda
    params:
      function-url: ${LAMBDA_FUNCTION_URL}
      region: ${AWS_REGION}
      invocation: async
    match:
      tables: ["public.orders"]
      operations: ["insert", "update"]
