services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro

  kaptanto:
    build:
      context: ../../..
      dockerfile: examples/shared/Dockerfile.kaptanto
    command: ["--config", "/app/kaptanto.yaml"]
    depends_on:
      - postgres
    ports:
      - "7662:7654"
    volumes:
      - ./kaptanto.yaml:/app/kaptanto.yaml:ro
