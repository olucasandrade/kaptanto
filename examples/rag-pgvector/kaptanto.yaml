source: postgres://postgres:postgres@postgres:5432/rag?sslmode=disable
output: vector
port: 7654
data-dir: /data
source-id: rag_pgvector_demo
insecure: true

tables:
  public.documents: {}

sinks:
  vector:
    source:
      columns: [title, body]
    embedder:
      provider: openai
      base-url: http://ollama:11434/v1
      model: nomic-embed-text
      dimensions: 768
      # api-key intentionally empty — local Ollama needs no auth
    store:
      provider: pgvector
      dsn: ${VECTOR_DSN}
      table: kaptanto_vectors
    metadata: [category]
    batch:
      max-events: 16
